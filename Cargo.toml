
[package]
name = "wa-rs"
version = "0.5.0"
edition = "2024"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
repository = "https://github.com/jlucaso1/whatsapp-rust"
readme = "README.md"
description = "Rust client for WhatsApp Web"

[workspace]
members = [
    ".",
    "http_clients/ureq-client",
    "storages/sqlite-storage",
    "tests/bench-integration",
    "tests/e2e",
    "transports/tokio-transport",
    "wacore",
    "wacore/appstate",
    "wacore/binary",
    "wacore/derive",
    "wacore/libsignal",
    "wacore/noise",
    "waproto",
]
default-members = [
    ".",
    "http_clients/ureq-client",
    "storages/sqlite-storage",
    "transports/tokio-transport",
    "wacore",
    "wacore/appstate",
    "wacore/binary",
    "wacore/derive",
    "wacore/libsignal",
    "wacore/noise",
    "waproto",
]

[workspace.lints.clippy]
# Force the wacore::time abstraction so WASM/deterministic-test builds don't
# regress. Exceptions carry `#[allow(clippy::disallowed_methods)]` inline.
disallowed_methods = "deny"

[workspace.dependencies]
# Shared dependencies
aes = "0.9.0"
aes-gcm = { version = "0.11.0-rc.3", default-features = false, features = ["aes", "alloc", "bytes"] }
anyhow = { version = "1.0", default-features = false }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
async-lock = { version = "3", default-features = false }
async-trait = "0.1.89"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bytemuck = { version = "1.22", default-features = false }
bytes = { version = "1.5", default-features = false }
chrono = { version = "0.4", default-features = false }
compact_str = { version = "0.9", default-features = false }
ctr = { version = "0.10", default-features = false }
env_logger = { version = "0.11", default-features = false }
event-listener = { version = "5", default-features = false }
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
getrandom = { version = "0.4", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
iai-callgrind = "0.16"
itoa = "1"
log = "0.4"
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
prost = { version = "0.14.3", default-features = false, features = ["std"] }
prost-build = { version = "0.14.3", default-features = false }
rand = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde-big-array = "0.5"
serde_json = { version = "1.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.48.0", default-features = false }
uuid = { version = "1", default-features = false }

# Internal workspace crates
wa-rs-core = { path = "./wacore", default-features = false, version = "0.5.0" }
wa-rs-appstate = { path = "./wacore/appstate", default-features = false, version = "0.5.0" }
wa-rs-binary = { path = "./wacore/binary", default-features = false, version = "0.5.0" }
wa-rs-derive = { path = "./wacore/derive", version = "0.5.0" }
wa-rs-libsignal = { path = "./wacore/libsignal", version = "0.5.0" }
wa-rs-noise = { path = "./wacore/noise", version = "0.5.0" }
wa-rs-proto = { path = "./waproto", version = "0.5.0" }
yoke = { version = "0.8", features = ["derive"] }

[features]
debug-diagnostics = ["wa-rs-core/debug-diagnostics"]
debug-snapshots = ["wa-rs-core/debug-snapshots"]
danger-skip-tls-verify = ["wa-rs-tokio-transport?/danger-skip-tls-verify"]
default = [
    "moka-cache",
    "simd",
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal",
]
moka-cache = ["dep:moka"]
simd = ["wa-rs-core/simd"]
ureq-client = ["dep:wa-rs-ureq-http"]
tokio-transport = ["dep:wa-rs-tokio-transport"]
tokio-runtime = ["dep:tokio"]
signal = ["tokio-runtime", "tokio/signal"]
sqlite-storage = ["wa-rs-sqlite-storage"]
tokio-native = ["tokio-runtime", "tokio/rt-multi-thread"]

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
async-lock = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
env_logger = { workspace = true }
event-listener = { workspace = true }
futures = { workspace = true, features = ["std"] }
hex = { workspace = true }
itoa = { workspace = true }
log = { workspace = true }
moka = { version = "0.12.12", features = ["future"], optional = true }
portable-atomic = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
scopeguard = "1.2"
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
wa-rs-core = { workspace = true }
wa-rs-binary = { workspace = true }
wa-rs-proto = { workspace = true }
wa-rs-sqlite-storage = { path = "./storages/sqlite-storage", version = "0.5.0", optional = true }
wa-rs-tokio-transport = { path = "./transports/tokio-transport", version = "0.5.0", optional = true }
wa-rs-ureq-http = { path = "./http_clients/ureq-client", version = "0.5.0", optional = true }

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }
wa-rs-noise = { path = "./wacore/noise", features = ["test-util"] }

[lints]
workspace = true

[[example]]
name = "benchmark"
required-features = ["danger-skip-tls-verify"]

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Benchmark profile: optimized but without aggressive LTO that breaks iai-callgrind
[profile.bench]
inherits = "release"
lto = "thin"
debug = 1
strip = false

# Profiling: optimized with debug symbols for DHAT / heaptrack / perf
[profile.profiling]
inherits = "release"
debug = 1
strip = false
